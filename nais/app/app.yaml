apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: infotek-personkort
  namespace: infotek
  labels:
    team: infotek
spec:
  image: "{{ image }}"
  port: 8080
  ingresses:
    - "{{ ingress }}"
  azure:
    sidecar:
      enabled: true
      autoLogin: true
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - NAVident
  liveness:
    path: /actuator/health/liveness
    initialDelay: 20
  readiness:
    path: /actuator/health/readiness
    initialDelay: 20
  prometheus:
    enabled: true
    path: /actuator/prometheus
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 90
