apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: infotek-personkort-frontend
  namespace: infotek
  labels:
    team: infotek
spec:
  image: "{{ image_frontend }}"
  port: 8080
  azure:
    sidecar:
      enabled: true
      autoLogin: true
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - NAVident
  accessPolicy:
    outbound:
      rules:
        - application: infotek-personkort-backend
          namespace: infotek
  liveness:
    path: /
    initialDelay: 20
  readiness:
    path: /
    initialDelay: 20
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 90
  env:
    - name: NODE_ENV
      value: production
