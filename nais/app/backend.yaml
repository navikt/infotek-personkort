apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: infotek-personkort-backend
  namespace: infotek
  labels:
    team: infotek
spec:
  image: "{{ image_backend }}"
  port: 8080
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        extra:
          - NAVident
  accessPolicy:
    inbound:
      rules:
        - application: infotek-personkort-frontend
          namespace: infotek
  liveness:
    path: /actuator/health/liveness
    initialDelay: 20
  readiness:
    path: /actuator/health/readiness
    initialDelay: 20
  prometheus:
    enabled: true
    path: /actuator/prometheus
  resources:
    requests:
      cpu: 15m
      memory: 256Mi
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 90
