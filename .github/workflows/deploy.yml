name: Build and deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          registry-url: "https://npm.pkg.github.com"
      - name: Build frontend
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend artifact
        run: mvn --batch-mode -pl backend -am clean package
        env:
          MAVEN_USERNAME: x-access-token
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: nais/docker-build-push@31c3a7321909bcb20799fdf46153fec721fd9512 # v0
        id: image
        with:
          team: infotek
          docker_context: ./backend
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: nais/deploy/actions/deploy@bf80eb8dba46797adb4909901e629bca8595a027 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/app/app.yaml
          VARS: nais/dev.json
          VAR: image=${{ needs.build.outputs.image }}

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: nais/deploy/actions/deploy@bf80eb8dba46797adb4909901e629bca8595a027 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: nais/app/app.yaml
          VARS: nais/prod.json
          VAR: image=${{ needs.build.outputs.image }}
