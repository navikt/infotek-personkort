name: Backend build

on:
  pull_request:
    paths:
      - "backend/**"
      - "pom.xml"
      - ".github/workflows/backend.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "pom.xml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build backend
        run: mvn --batch-mode -pl backend -am clean verify

