name: Build

on:
  pull_request:
  push:
    branches: ["main"]
  # MIDLERTIDIG: manuell trigger for å teste READER_TOKEN-fiksen på datagrid før merge.
  # Fjern denne før PR-en merges.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
          registry-url: "https://npm.pkg.github.com"
      - name: Build frontend
        run: |
          cd frontend
          pnpm install --no-frozen-lockfile
          pnpm test
          pnpm run build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build backend
        run: mvn --batch-mode -pl backend -am clean verify
        env:
          MAVEN_USERNAME: x-access-token
          MAVEN_PASSWORD: ${{ secrets.READER_TOKEN }}
